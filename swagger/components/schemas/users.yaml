type: object
required:
  - _id
  - name
  - email
  - password
properties:
  _id:
    description: "User's unique identifier"
    type: string
    example: '673630dd96a3005e64a8ff5d'
  name:
    description: "User's full name"
    type: string
    example: 'John Doe'
  email:
    description: "User's email address"
    type: string
    format: email
    example: 'johndoe@example.com'
  password:
    description: "User's password (hashed)"
    type: string
    example: '$2b$10$kZpVtn7WstcYN6aSg03Wi.09bA2PPwpSt/4QbeJSJlw.ko8Wkh4ue'